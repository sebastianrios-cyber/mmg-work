<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1b1430;font-family:'Inter Display','Inter',sans-serif;color:#fff}
#cam{position:absolute;inset:0;will-change:transform}
#wall{position:absolute;inset:0;background:linear-gradient(180deg,#3b2a5a 0%,#5a3d6e 45%,#7a4f6a 70%)}
#wall:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 60px,transparent 60px 120px)}
#floor{position:absolute;left:0;right:0;top:1330px;bottom:0;background:linear-gradient(180deg,#8a5a3a,#5e3a24)}
#rug{position:absolute;left:140px;right:140px;top:1520px;height:220px;border-radius:50%;background:#2aa39c;box-shadow:inset 0 0 0 18px #22867f}
#tv{position:absolute;left:290px;width:500px;top:430px;height:300px;border-radius:14px;background:#111;padding:16px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
#scr{width:100%;height:100%;border-radius:6px;background:linear-gradient(180deg,#2b1b5a,#ff3d9a 60%,#ffb347 78%,#13324a 79%);position:relative;overflow:hidden}
#sun{position:absolute;left:50%;top:52%;width:120px;height:120px;margin-left:-60px;border-radius:50%;background:#ffd23f;clip-path:inset(0 0 50% 0)}
.palm{position:absolute;bottom:22%;width:8px;height:90px;background:#120c22}
.palm:before{content:"";position:absolute;left:-30px;top:-18px;width:68px;height:26px;border-radius:50%;background:#120c22}
#sofa{position:absolute;left:60px;right:60px;top:930px;height:420px}
#sofa .back{position:absolute;left:40px;right:40px;top:0;height:250px;border-radius:40px 40px 10px 10px;background:#4f6f8f}
#sofa .seat{position:absolute;left:0;right:0;top:200px;height:200px;border-radius:30px;background:#5e7f9e}
#sofa .c1{position:absolute;left:120px;top:90px;width:170px;height:150px;border-radius:24px;background:#ff8a5c;transform:rotate(-8deg)}
#sofa .c2{position:absolute;right:120px;top:90px;width:170px;height:150px;border-radius:24px;background:#ffd23f;transform:rotate(8deg)}
#lamp{position:absolute;left:880px;top:560px;width:150px;height:800px}
#lamp .sh{position:absolute;left:0;top:0;width:150px;height:110px;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);background:#fff1d0;box-shadow:0 0 80px #ffd9a0}
#lamp .po{position:absolute;left:72px;top:110px;width:8px;height:680px;background:#2a2a2a}
.pup{position:absolute;top:880px;width:560px;height:654px;filter:drop-shadow(0 26px 30px rgba(0,0,0,.45));transform-origin:50% 100%}
#N{left:-10px} #A{left:530px}
#top{position:absolute;top:70px;left:0;right:0;text-align:center}
#tag{display:inline-block;font-weight:900;font-size:34px;letter-spacing:.14em;padding:10px 26px;border-radius:999px;background:#ff3d9a;color:#07060d}
#tag2{display:inline-block;margin-left:12px;font-weight:800;font-size:28px;letter-spacing:.2em;opacity:.9}
#cap{position:absolute;left:60px;right:60px;top:200px;text-align:center}
#who{display:inline-block;font-weight:900;font-size:34px;letter-spacing:.12em;padding:8px 22px;border-radius:12px;color:#07060d;margin-bottom:14px}
#txt{font-weight:900;font-size:84px;line-height:1.05;text-transform:uppercase;-webkit-text-stroke:10px #07060d;paint-order:stroke fill;text-shadow:0 8px 20px rgba(0,0,0,.6)}
#foot{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:20px;opacity:.5;font-weight:600}
#flash{position:absolute;inset:0;background:#fff;opacity:0}

/* ---- cartoon ---- */
.pup svg :is(path,circle,ellipse,rect):not([stroke]){stroke:#1a1022;stroke-width:7px;paint-order:stroke fill}
.pup svg{filter:url(#ol)}
#tv,#sofa .back,#sofa .seat,#sofa .c1,#sofa .c2,#rug,#lamp .sh{outline:none;box-shadow:none;border:7px solid #1a1022}
#lamp .po{border:3px solid #1a1022}
#wall{background:#6c4bb4!important}
#wall:after{background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 50px,transparent 50px 100px)!important}
#floor{background:#c98a52!important;border-top:7px solid #1a1022}
#rug{background:#35c4b9!important}
#sofa .back{background:#4a8fd6!important}#sofa .seat{background:#5aa3eb!important}
#win{position:absolute;left:60px;top:560px;width:190px;height:240px;background:#8fd3ff;border:7px solid #1a1022;border-radius:12px}
#win:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:7px;margin-left:-3px;background:#1a1022}
#win:after{content:"";position:absolute;top:50%;left:0;right:0;height:7px;margin-top:-3px;background:#1a1022}
#cap{display:none}
#bub{position:absolute;top:300px;width:620px;padding:30px 36px;background:#fff;border:8px solid #1a1022;border-radius:60px;color:#1a1022;text-align:center;transform-origin:50% 100%}
#bub .t{font-weight:900;font-size:62px;line-height:1.05;text-transform:uppercase}
#bub .n{position:absolute;top:-34px;left:40px;font-weight:900;font-size:30px;letter-spacing:.1em;padding:6px 18px;border-radius:12px;border:6px solid #1a1022;color:#1a1022}
#bub:after{content:"";position:absolute;bottom:-58px;width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-top:58px solid #1a1022}
#bub:before{content:"";position:absolute;bottom:-40px;width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:42px solid #fff;z-index:2}
#bub.L:after{left:120px}#bub.L:before{left:130px}#bub.R:after{right:120px}#bub.R:before{right:130px}
#pow{position:absolute;font-weight:900;font-size:120px;color:#ffd23f;-webkit-text-stroke:10px #1a1022;paint-order:stroke fill;opacity:0;transform-origin:50% 50%}
</style></head><body>
<div id="cam">
 <div id="wall"></div>
 <div id="win"></div><div id="tv"><div id="scr"><div id="sun"></div><div class="palm" style="left:60px"></div><div class="palm" style="left:110px;height:70px"></div><div class="palm" style="right:70px"></div></div></div>
 <div id="lamp"><div class="sh"></div><div class="po"></div></div>
 <div id="floor"></div><div id="rug"></div>
 <div id="sofa"><div class="back"></div><div class="seat"></div><div class="c1"></div><div class="c2"></div></div>
 <div id="N" class="pup"></div><div id="A" class="pup"></div>
</div>
<div id="top"><span id="tag">GTA 6</span><span id="tag2">HUMOR</span></div>
<div id="cap"><div id="who"></div><div id="txt"></div></div>
<svg width="0" height="0" style="position:absolute"><filter id="ol"><feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/><feFlood flood-color="#1a1022"/><feComposite in2="d" operator="in" result="o"/><feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge></filter></svg><div id="bub"><div class="n"></div><div class="t"></div></div><div id="pow"></div>
<div id="foot">Miami Game · Canal no oficial · Animación hecha por computadora, voces sintéticas</div>
<div id="flash"></div>
<script type="module">
import { LINES, ENV, CAPS, TOTAL } from './data.js';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), eOut=x=>1-Math.pow(1-clamp(x),3);
function svg(o){ return `<svg viewBox="0 0 600 700" width="560" height="654">
 <g id="${o.id}body">
  <path d="M95 700 C95 520 170 455 300 455 C430 455 505 520 505 700 Z" fill="${o.top}"/>
  ${o.shawl?`<path d="M150 500 C200 560 400 560 450 500 L430 470 C380 520 220 520 170 470 Z" fill="#f5e6c8"/>`:`<path d="M255 470 L300 540 L345 470" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".85"/>`}
  <g id="${o.id}arms">
   <path d="M130 600 C150 540 200 560 220 600" stroke="${o.top}" stroke-width="58" stroke-linecap="round" fill="none"/>
   <path d="M470 600 C450 540 400 560 380 600" stroke="${o.top}" stroke-width="58" stroke-linecap="round" fill="none"/>
   ${o.pad?`<rect x="200" y="575" width="200" height="84" rx="42" fill="#111" stroke="#21e6c1" stroke-width="6"/><circle cx="350" cy="606" r="9" fill="#ff3d9a"/>`:''}
   <circle cx="215" cy="610" r="30" fill="#f2c29b"/><circle cx="385" cy="610" r="30" fill="#f2c29b"/>
  </g>
 </g>
 <g id="${o.id}head">
  <rect x="268" y="400" width="64" height="70" rx="20" fill="#e3ad83"/>
  <circle cx="122" cy="265" r="34" fill="#e3ad83"/><circle cx="478" cy="265" r="34" fill="#e3ad83"/>
  <circle cx="300" cy="255" r="178" fill="#f2c29b"/>
  ${o.cap?`<path d="M128 190 C140 70 460 70 472 190 C470 170 380 130 300 130 C220 130 130 170 128 190 Z" fill="#3a2418"/>
   <path d="M120 175 C130 40 470 40 480 175 L120 175 Z" fill="${o.cap}"/><path d="M120 175 L480 175" stroke="#07060d" stroke-width="8"/>
   <path d="M440 168 C520 160 560 175 565 190 L470 190 Z" fill="${o.cap}"/>`:''}
  ${o.grey?`<circle cx="300" cy="78" r="62" fill="#dcdce4"/><path d="M122 230 C120 90 480 90 478 230 C440 150 160 150 122 230 Z" fill="#dcdce4"/>`:''}
  ${o.wrinkle?`<path d="M240 165 Q300 155 360 165" stroke="#d49a76" stroke-width="5" fill="none"/>`:''}
  <ellipse cx="210" cy="315" rx="30" ry="17" fill="#ff7f8f" opacity=".45"/><ellipse cx="390" cy="315" rx="30" ry="17" fill="#ff7f8f" opacity=".45"/>
  <g transform="translate(232 250)"><ellipse rx="40" ry="46" fill="#fff"/><circle id="${o.id}pL" r="20" fill="#14121f"/><circle cx="8" cy="-10" r="7" fill="#fff" stroke="none"/></g>
  <g transform="translate(368 250)"><ellipse rx="40" ry="46" fill="#fff"/><circle id="${o.id}pR" r="20" fill="#14121f"/><circle cx="8" cy="-10" r="7" fill="#fff" stroke="none"/></g>
  <rect id="${o.id}lL" x="190" y="200" width="84" height="0" fill="#f2c29b"/><rect id="${o.id}lR" x="326" y="200" width="84" height="0" fill="#f2c29b"/>
  ${o.glasses?`<circle cx="232" cy="250" r="56" fill="none" stroke="#222" stroke-width="9"/><circle cx="368" cy="250" r="56" fill="none" stroke="#222" stroke-width="9"/><path d="M288 250 L312 250" stroke="#222" stroke-width="9"/>`:''}
  <path id="${o.id}bL" d="M195 180 L268 176" stroke="${o.brow}" stroke-width="14" stroke-linecap="round"/>
  <path id="${o.id}bR" d="M332 176 L405 180" stroke="${o.brow}" stroke-width="14" stroke-linecap="round"/>
  <path d="M300 268 C290 300 296 312 310 310" fill="none" stroke="#c98e66" stroke-width="7" stroke-linecap="round"/>
  <g transform="translate(300 352)"><ellipse id="${o.id}m" rx="52" ry="6" fill="#5a1220"/><ellipse id="${o.id}t" cx="0" cy="10" rx="26" ry="0" fill="#ff6b7a"/></g>
 </g></svg>`; }
document.getElementById('N').innerHTML=svg({id:'N',top:'#7c4dff',cap:'#ff3d9a',brow:'#3a2418',pad:1});
document.getElementById('A').innerHTML=svg({id:'A',top:'#e0708a',grey:1,glasses:1,shawl:1,wrinkle:1,brow:'#9a9aa4'});
const $=id=>document.getElementById(id);
const lineAt=t=>LINES.findIndex(L=>t>=L.start&&t<L.end);
const lastLine=t=>{let k=-1;LINES.forEach((L,i)=>{if(t>=L.start-0.12)k=i});return k};
function mouth(who,t){const i=lineAt(t); if(i<0||LINES[i].who!==who) return 0; const f=t*30,a=ENV[Math.floor(f)]||0,b=ENV[Math.floor(f)+1]||0; return clamp((a+(b-a)*(f%1))*1.2);}
function pose(who,t,li,lt){
 const me=$(who), other=who==='N'?1:-1, spk=lineAt(t)>=0&&LINES[lineAt(t)].who===who;
 let dy=Math.sin(t*2.2+(who==='A'?1:0))*6, rot=Math.sin(t*1.3+(who==='A'?2:0))*1.5, sq=1, arms=0, head=0, brow=[0,0], look=other*12, lookY=0, mo=mouth(who,t);
 if(spk){ dy+=Math.sin(t*14)*6; rot+=Math.sin(t*5)*3.5; arms=Math.sin(lt*6)*-20; sq=1+mouth(who,t)*0.05; }
 if(lt<0.25&&spk){ sq*=1+0.08*Math.sin(lt/0.25*Math.PI); }
 const r=eOut(clamp(lt/0.3));
 if(who==='N'&&li===0){ brow=[14,-14]; arms=-40*r; }
 if(who==='A'&&li===1){ brow=[-18,18]; sq=1+0.05*Math.sin(clamp(lt/0.3)*Math.PI); mo=Math.max(mo,0.35); }
 if(who==='N'&&li===1){ brow=[12,-12]; }
 if(who==='A'&&li===3){ brow=[10,-10]; head=-6*r; }
 if(who==='N'&&li===4){ arms=-90*r; brow=[-16,16]; dy-=30*r; }
 if(who==='A'&&li===4){ brow=[-10,10]; }
 if(who==='N'&&li===5){ head=10*r; dy+=24*r; brow=[16,-16]; look=other*8; lookY=10; }
 if(who==='A'&&(li===5||li===9)){ brow=[12,-12]; head=-5*r; }
 if(who==='N'&&li===6){ arms=-30*r; brow=[14,-14]; }
 if(who==='A'&&li===7){ brow=[-14,14]; lookY=-10; }
 if(who==='A'&&li===8){ brow=[-18,18]; mo=Math.max(mo,0.6*r); }
 if(who==='N'&&li===9){ const k=eOut(clamp((lt-0.6)/0.5)); head=12*k; dy+=30*k; brow=[18,-18]; lookY=12*k; }
 me.style.transform=`translateY(${dy}px) rotate(${rot}deg) scale(${1/sq},${sq})`;
 $(who+'head').setAttribute('transform',`rotate(${head+(spk?Math.sin(t*9)*1.5:0)} 300 430)`);
 $(who+'arms').setAttribute('transform',`translate(0 ${arms})`);
 $(who+'bL').setAttribute('transform',`rotate(${brow[0]} 232 178)`); $(who+'bR').setAttribute('transform',`rotate(${brow[1]} 368 178)`);
 ['pL','pR'].forEach(p=>{$(who+p).setAttribute('cx',look);$(who+p).setAttribute('cy',lookY)});
 const bl=((t+(who==='A'?1.4:0))%3.6)<0.12?100:0; $(who+'lL').setAttribute('height',bl); $(who+'lR').setAttribute('height',bl);
 $(who+'m').setAttribute('ry',(6+mo*44).toFixed(1)); $(who+'m').setAttribute('rx',(52-mo*6).toFixed(1)); $(who+'t').setAttribute('ry',(mo*16).toFixed(1));
}
const WIDE=new Set([0,4,9]);
window.renderAt=function(t){
 const li=Math.max(0,lastLine(t)), L=LINES[li], lt=t-(L.start-0.12);
 pose('N',t,li,lt); pose('A',t,li,lt);
 // cámara
 let s=1, ox=540, oy=1300;
 if(!WIDE.has(li)){ s=1.38+0.05*clamp(lt/2.5); ox=L.who==='N'?300:780; oy=1250; }
 else { s=1+0.04*clamp(lt/4); }
 $('cam').style.transformOrigin=`${ox}px ${oy}px`; $('cam').style.transform=`scale(${s}) translate(${Math.sin(t*0.8)*4}px,${Math.cos(t*0.6)*3}px)`;
 $('flash').style.opacity=li>0?Math.max(0,1-lt/0.1)*0.35:0;
 // bocadillos
 const ci=CAPS.filter(c=>t>=c[0]).pop(); const sh=ci&&(ci.length<4||t<ci[3]); const B=$('bub'); B.style.opacity=sh?1:0;
 if(sh){ const w=ci[2]; B.className=w==='N'?'L':'R'; B.style.left=w==='N'?'60px':'400px'; B.querySelector('.n').textContent=w==='N'?'NIETO':'ABUELA'; B.querySelector('.n').style.background=w==='N'?'#a98bff':'#ffb3c6'; B.querySelector('.t').textContent=ci[1]; const k=clamp((t-ci[0])/0.14); B.style.transform=`scale(${0.85+0.15*eOut(k)}) rotate(${w==='N'?-1.5:1.5}deg)`; }
 const POW={4:['¡¿13 AÑOS?!',700,560],1:['¿¡$80!?',620,540],8:['¡2027!',300,600]}; const pw=POW[li]; const P=$('pow');
 if(pw&&lt<1.4){ P.textContent=pw[0]; P.style.left=pw[1]+'px'; P.style.top=pw[2]+'px'; P.style.opacity=clamp((1.4-lt)/0.3); P.style.transform=`translate(-50%,-50%) scale(${eOut(clamp(lt/0.18))*1.0+0.1}) rotate(-8deg)`; } else P.style.opacity=0;
 // subtítulos
 const c=CAPS.filter(c=>t>=c[0]).pop(); const show=c&&(c.length<4||t<c[3]);
 $('cap').style.opacity=show?1:0;
 if(show){ const w=c[2]; $('who').textContent=w==='N'?'NIETO':'ABUELA'; $('who').style.background=w==='N'?'#7c4dff':'#ff9ab0'; $('txt').textContent=c[1]; $('txt').style.color=w==='N'?'#fff':'#ffe3ec';
  const k=clamp((t-c[0])/0.12); $('txt').style.transform=`scale(${0.9+0.1*k})`; }
};
window.__READY__=true;
</script></body></html>
