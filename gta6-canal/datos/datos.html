<!doctype html><html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#060607;font-family:'Inter Display','Inter',sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden}
#grid{position:absolute;inset:-160px;background:
 linear-gradient(rgba(255,61,154,.075) 1.5px,transparent 1.5px) 0 0/80px 80px,
 linear-gradient(90deg,rgba(255,61,154,.075) 1.5px,transparent 1.5px) 0 0/80px 80px}
#glow{position:absolute;left:50%;top:-330px;width:1300px;height:640px;margin-left:-650px;background:radial-gradient(closest-side,rgba(255,255,255,.20),rgba(255,120,170,.06) 60%,transparent)}
#glow2{position:absolute;left:50%;bottom:-500px;width:2000px;height:800px;margin-left:-1000px;background:radial-gradient(closest-side,rgba(124,77,255,.10),transparent)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 50%,rgba(0,0,0,.7) 100%);pointer-events:none}
.pdot{position:absolute;width:5px;height:5px;border-radius:50%;background:#ff3d9a;box-shadow:0 0 10px #ff3d9a}
.ring{position:absolute;width:26px;height:17px;border-radius:50%;border:2.5px solid rgba(255,255,255,.5)}
.ring:after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:rgba(255,255,255,.65)}
#pill{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:#fff;color:#0b0b0d;font-weight:700;font-size:26px;letter-spacing:3px;padding:11px 28px;border-radius:40px;white-space:nowrap;box-shadow:0 0 40px rgba(255,255,255,.25)}
.sc{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0}
.y{background:linear-gradient(180deg,#ffc56b 0%,#ff7a59 50%,#ff3d9a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,61,154,.45))}
.big{position:absolute;top:290px;left:100px;right:100px;text-align:center;font-weight:800;font-size:170px;line-height:1.02;letter-spacing:-4px}
.sub{position:absolute;top:520px;left:0;right:0;text-align:center;font-size:32px;letter-spacing:7px;text-transform:uppercase;color:#aaa;font-weight:600}
.box{position:absolute;left:600px;right:600px;top:215px;height:360px;border:4px solid #fff;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,8,10,.75)}
.num{font-weight:800;font-size:150px;letter-spacing:-4px;line-height:1}
.lbl{margin-top:18px;font-size:28px;letter-spacing:5px;text-transform:uppercase;color:#ddd;font-weight:600}
.note{position:absolute;top:615px;left:0;right:0;text-align:center;font-size:24px;letter-spacing:5px;color:#8d8d8d;text-transform:uppercase;font-weight:600}
.tl{position:absolute;left:300px;right:300px;top:440px;height:4px;background:rgba(255,255,255,.18);border-radius:2px}
.tlf{position:absolute;left:0;top:0;height:4px;background:#fff;border-radius:2px;box-shadow:0 0 14px #fff}
.tp{position:absolute;top:-16px;width:36px;height:36px;margin-left:-18px;border-radius:50%;border:5px solid #fff;background:#060607}
.tp.hi{border-color:#ff3d9a;background:#ff8a3d;box-shadow:0 0 30px #ff3d9a}
.ty{position:absolute;top:-120px;width:400px;margin-left:-200px;text-align:center;font-weight:800;font-size:56px;white-space:nowrap}
.tn{position:absolute;top:50px;width:340px;margin-left:-170px;text-align:center;font-size:28px;color:#aaa;font-weight:600}
.bars{position:absolute;left:560px;right:560px;top:150px;height:480px;display:flex;align-items:flex-end;justify-content:center;gap:50px;border-bottom:4px solid #fff}
.bar{width:150px;position:relative;border:4px solid #fff;border-bottom:none;border-radius:16px 16px 0 0;background:rgba(255,255,255,.05)}
.bar.hi{border-color:#ff3d9a;background:linear-gradient(180deg,rgba(255,138,61,.35),rgba(255,61,154,.15));box-shadow:0 0 30px rgba(255,61,154,.35)}
.bv{position:absolute;top:-76px;left:-40px;right:-40px;text-align:center;font-weight:800;font-size:56px}
.bl{position:absolute;bottom:-50px;left:-60px;right:-60px;text-align:center;font-size:24px;color:#aaa;font-weight:600;white-space:nowrap}
.cards{position:absolute;left:520px;right:520px;top:170px;display:flex;flex-direction:column;gap:24px}
.card{height:128px;border:3px solid rgba(255,255,255,.9);border-radius:22px;display:flex;align-items:center;padding:0 34px;gap:30px;background:rgba(8,8,10,.75)}
.card .k{flex:0 0 auto;min-width:76px;height:76px;padding:0 14px;border-radius:40px;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px;white-space:nowrap}
.card.ok .k{border-color:#21e6c1;color:#21e6c1;box-shadow:0 0 18px rgba(33,230,193,.35)}
.card.x .k{border-color:#ff3d9a;color:#ff3d9a;box-shadow:0 0 18px rgba(255,61,154,.35)}
.card .v{font-size:38px;font-weight:700;line-height:1.1}
.card.wide .k{font-size:28px}
.vs{position:absolute;left:420px;right:420px;top:200px;display:flex;gap:120px;align-items:center}
.vb{flex:1;height:380px;border:4px solid #fff;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,8,10,.75)}
.vb .a{font-weight:800;font-size:96px;letter-spacing:-2px}
.vb .b{margin-top:14px;font-size:26px;letter-spacing:4px;color:#bbb;text-transform:uppercase;font-weight:600;text-align:center;padding:0 10px}
.vsx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;background:#fff;color:#000;font-weight:900;font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(255,255,255,.4)}
.meter{position:absolute;left:460px;right:460px;top:330px;height:110px;border:4px solid #fff;border-radius:24px;overflow:hidden;background:rgba(8,8,10,.75)}
.mf{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,#ff8a3d 0 22px,#ff3d9a 22px 44px);box-shadow:0 0 30px #ff3d9a}
.mt{position:absolute;top:200px;left:0;right:0;text-align:center;font-weight:800;font-size:62px}
.ml{position:absolute;top:470px;left:0;right:0;text-align:center;font-size:26px;color:#aaa;letter-spacing:4px;font-weight:600;text-transform:uppercase}
.pct{position:absolute;top:530px;left:0;right:0;text-align:center;font-weight:800;font-size:90px}
#cap{position:absolute;left:220px;right:220px;top:790px;text-align:center;font-weight:700;font-size:52px;line-height:1.2;letter-spacing:-.5px}
#cap span{display:inline-block;margin:0 .12em}
#base{position:absolute;left:0;right:0;top:745px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55) 20%,rgba(255,255,255,.55) 80%,transparent)}
#brand{position:absolute;bottom:34px;left:60px;font-size:22px;letter-spacing:9px;font-weight:800;color:#ff7ac0;text-shadow:0 0 14px rgba(255,61,154,.7)}
#prog{position:absolute;left:0;bottom:0;height:6px;background:linear-gradient(90deg,#7c4dff,#ff3d9a,#ff8a3d);box-shadow:0 0 14px #ff3d9a}
#ai{position:absolute;bottom:36px;right:60px;font-size:18px;letter-spacing:3px;color:rgba(255,255,255,.35);font-weight:600}
#scan{position:absolute;left:0;right:0;height:200px;background:linear-gradient(transparent,rgba(255,255,255,.05),transparent);pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style></head><body>
<div id="stage"><div id="grid"></div><div id="glow"></div><div id="glow2"></div><div id="parts"></div><div id="scenes"></div><div id="scan"></div><div id="vig"></div>
<div id="base"></div><div id="pill"></div><div id="cap"></div><div id="brand">MIAMI GAME</div><div id="ai">ANIMACIÓN · DATOS PÚBLICOS</div><div id="prog"></div><div id="flash"></div></div>
<script type="module">
import { STORIES } from './stories.js';
const q=new URLSearchParams(location.search); const S=STORIES[+q.get('i')||0];
const $=id=>document.getElementById(id), clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3), eb=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const hl=s=>s.replace(/\*([^*]+)\*/g,'<span class="y">$1</span>');
// timing
const VO=window.__VO__; let t0=0; S.scenes.forEach((sc,i)=>{const w=sc.cap.replace(/\*/g,'').split(/\s+/).length; sc.vo=VO?VO[i]:0; sc.dur=VO?Math.max(2.9,VO[i]+0.75):Math.max(3.2,Math.min(5.6,w*0.34+1.5)); sc.t0=t0; t0+=sc.dur;});
const TOTAL=t0+0.6; window.TOTAL=TOTAL;
// particles
const P=[]; let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<26;i++){const e=document.createElement('div'); e.className=rnd()<.5?'ring':'pdot'; $('parts').appendChild(e); P.push({e,x:rnd()*1920,y:rnd()*1080,vx:(rnd()-.5)*14,vy:-6-rnd()*14,ph:rnd()*6});}
// build scenes
const cues=[];
S.scenes.forEach((sc,i)=>{
 const d=document.createElement('div'); d.className='sc'; let h='';
 if(sc.t==='title') h=`<div class="big">${hl(sc.big)}</div>${sc.sub?`<div class="sub">${sc.sub}</div>`:''}`;
 if(sc.t==='count') h=`<div class="box"><div class="num y"></div><div class="lbl">${sc.label}</div></div><div class="note">${sc.note||''}</div>`;
 if(sc.t==='timeline'){const n=sc.pts.length; h=`<div class="tl"><div class="tlf"></div>${sc.pts.map((p,j)=>{const x=(j/(n-1))*100;return `<div class="tp ${j===sc.hi?'hi':''}" style="left:${x}%"></div><div class="ty ${j===sc.hi?'y':''}" style="left:${x}%">${p[0]}</div><div class="tn" style="left:${x}%">${p[1]}</div>`}).join('')}</div>`;}
 if(sc.t==='bars'){const mx=Math.max(...sc.items.map(b=>+b[1])); const w=sc.items.length>3?150:200; h=`<div class="bars">${sc.items.map((b,j)=>`<div class="bar ${j===sc.hi?'hi':''}" data-h="${(+b[1]/mx)*360}" style="width:${w}px"><div class="bv ${j===sc.hi?'y':''}">${b[1]}</div><div class="bl">${b[0]}</div></div>`).join('')}</div>`;}
 if(sc.t==='cards') h=`<div class="cards">${sc.items.map(c=>`<div class="card ${c[2]} ${c[0].length>3?'wide':''}"><div class="k">${c[0]}</div><div class="v">${c[1]}</div></div>`).join('')}</div>`;
 if(sc.t==='vs') h=`<div class="vs"><div class="vb"><div class="a">${sc.a[0]}</div><div class="b">${sc.a[1]}</div></div><div class="vb" style="border-color:#ff3d9a;box-shadow:0 0 50px rgba(255,61,154,.35)"><div class="a y">${sc.b[0]}</div><div class="b">${sc.b[1]}</div></div><div class="vsx">VS</div></div>`;
 if(sc.t==='meter') h=`<div class="mt">GTA 6 = <span class="y">212 GB</span></div><div class="meter"><div class="mf"></div></div><div class="ml">${sc.label}</div><div class="pct y"></div>`;
 d.innerHTML=h; $('scenes').appendChild(d); sc.el=d;
 cues.push({t:sc.t0,k:'whoosh'});
 if(sc.t==='count') cues.push({t:sc.t0+0.35,k:'riser'},{t:sc.t0+1.65,k:'impact'});
 if(sc.t==='title') cues.push({t:sc.t0+0.25,k:'impact'});
 if(sc.t==='cards') sc.items.forEach((_,j)=>cues.push({t:sc.t0+0.35+j*0.45,k:'pop'}));
 if(sc.t==='timeline') sc.pts.forEach((_,j)=>cues.push({t:sc.t0+0.3+j*0.4,k:j===sc.hi?'impact':'click'}));
 if(sc.t==='bars') sc.items.forEach((_,j)=>cues.push({t:sc.t0+0.3+j*0.25,k:'tick'}));
 if(sc.t==='vs') cues.push({t:sc.t0+0.3,k:'pop'},{t:sc.t0+0.6,k:'pop'},{t:sc.t0+0.9,k:'impact'});
 if(sc.t==='meter') cues.push({t:sc.t0+0.4,k:'riser'},{t:sc.t0+1.6,k:'impact'});
});
window.CUES=cues; window.__STARTS__=S.scenes.map(x=>x.t0);
const fmt=(sc,v)=>{let s=Math.round(v).toLocaleString('es-ES'); if(sc.to>=1000&&sc.to<10000&&sc.to%1000===0&&sc.pre==='$') s=Math.round(v).toLocaleString('es-ES'); if(sc.to>=2000&&sc.to<2100) s=String(Math.round(v)); return (sc.pre||'')+s+(sc.suf||'');};
window.renderAt=t=>{
 // ambient
 $('grid').style.transform=`translate(${(t*-10)%80}px,0)`;
 $('scan').style.top=(((t*180)%1600)-300)+'px';
 P.forEach(p=>{p.e.style.transform=`translate(${((p.x-18*t)%1920+1920)%1920}px,${((p.y+p.vy*0.3*t)%1080+1080)%1080}px)`; p.e.style.opacity=.35+.35*Math.sin(t*1.3+p.ph);});
 $('prog').style.width=(t/TOTAL*1920)+'px';
 let cur=S.scenes.filter(s=>t>=s.t0).pop()||S.scenes[0]; const lt=t-cur.t0; const last=cur===S.scenes[S.scenes.length-1];
 $('flash').style.opacity=cur.t0>0?Math.max(0,1-lt/0.12)*0.18:0;
 S.scenes.forEach(sc=>{ if(sc!==cur){sc.el.style.opacity=0;return;}
  const out=last?1:clamp((sc.dur-lt)/0.25); const inn=eo(lt/0.45);
  sc.el.style.opacity=Math.min(inn,out); sc.el.style.transform=`translateY(${(1-inn)*40}px) scale(${1+0.03*clamp(lt/sc.dur)})`; sc.el.style.filter=`blur(${(1-inn)*14}px)`;
  const E=sc.el;
  if(sc.t==='title'){const b=E.querySelector('.big'); b.style.transform=`scale(${0.7+0.3*eb(lt/0.55)})`; const s=E.querySelector('.sub'); if(s) s.style.opacity=eo((lt-0.5)/0.4);}
  if(sc.t==='count'){const k=eo((lt-0.3)/1.35); E.querySelector('.num').textContent=fmt(sc,sc.from+(sc.to-sc.from)*k); const bx=E.querySelector('.box'); const pop=lt>1.65?1+0.08*Math.max(0,1-(lt-1.65)/0.25):1; bx.style.transform=`scale(${eb(lt/0.5)*pop})`; E.querySelector('.note').style.opacity=eo((lt-1.7)/0.4);}
  if(sc.t==='timeline'){const n=sc.pts.length; const k=clamp((lt-0.2)/(0.4*(n-1)+0.2)); E.querySelector('.tlf').style.width=(k*100)+'%';
   E.querySelectorAll('.tp').forEach((e,j)=>{const a=eb((lt-0.3-j*0.4)/0.35); e.style.transform=`scale(${a})`;});
   E.querySelectorAll('.ty,.tn').forEach((e,j)=>{const a=eo((lt-0.35-Math.floor(j/2)*0.4)/0.35); e.style.opacity=a; e.style.transform=`translateY(${(1-a)*30}px)`;});}
  if(sc.t==='bars') E.querySelectorAll('.bar').forEach((e,j)=>{const a=eb((lt-0.3-j*0.25)/0.7); e.style.height=(+e.dataset.h*Math.max(0,a))+'px'; e.querySelector('.bv').style.opacity=clamp(a*1.5);});
  if(sc.t==='cards') E.querySelectorAll('.card').forEach((e,j)=>{const a=eb((lt-0.35-j*0.45)/0.45); e.style.opacity=clamp(a*2); e.style.transform=`translateX(${(1-clamp(a))*-160}px) scale(${0.9+0.1*clamp(a)})`;});
  if(sc.t==='vs') E.querySelectorAll('.vb,.vsx').forEach((e,j)=>{const a=eb((lt-0.3-j*0.3)/0.45); e.style.opacity=clamp(a*2); e.style.transform=(j===2?'translate(-50%,-50%) ':'')+`scale(${Math.max(0,a)})`;});
  if(sc.t==='meter'){const k=eo((lt-0.4)/1.2); const f=sc.used/sc.total; E.querySelector('.mf').style.width=(k*f*100)+'%'; E.querySelector('.pct').textContent=Math.round(k*f*100)+'%'; E.querySelector('.ml').style.opacity=eo((lt-1.4)/0.4);}
 });
 // pill
 const pl=$('pill'); pl.textContent=cur.pill; const pa=eb(lt/0.35); pl.style.transform=`translateX(-50%) scale(${Math.max(0.01,pa)})`; pl.style.opacity=clamp(pa*2);
 // caption, word by word
 if($('cap').dataset.k!==String(S.scenes.indexOf(cur))){ $('cap').dataset.k=S.scenes.indexOf(cur);
  const ws=[]; cur.cap.replace(/\*([.,;:!?…]+)/g,'$1*').split(/(\*[^*]+\*)/).forEach(seg=>{ if(!seg) return; const y=seg.startsWith('*'); seg.replace(/\*/g,'').split(/\s+/).filter(Boolean).forEach(w=>ws.push(`<span class="${y?'y':''}">${w}</span>`)); });
  $('cap').innerHTML=ws.join(' ');}
 const spans=[...$('cap').children], per=cur.vo?(cur.vo*0.92)/spans.length:Math.min(0.16,(cur.dur*0.55)/spans.length);
 spans.forEach((s,j)=>{const a=eo((lt-(cur.vo?0.2:0.15)-j*per)/0.18); s.style.opacity=a; s.style.transform=`translateY(${(1-a)*24}px)`;});
};
window.__READY__=true;
</script></body></html>
