<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>

<script type="module">

// ---- océano

 fragmentShader:`uniform float t; varying vec3 w; void main(){ float d=length(w.xz); vec3 c=vec3(.004,.002,.018);
  float stripe=sin(w.z*.9+t*2.)*sin(w.x*.25+t*.7); float refl=smoothstep(.4,1.,stripe)*exp(-abs(w.x)*.02)*smoothstep(-500.,-40.,w.z);
  refl*=smoothstep(.9,.98,sin(w.z*.35+t*1.3)*.5+.5+sin(w.x*.9)*.2)*exp(-abs(w.x-20.)*.03); c+=vec3(1.,.4,.6)*refl*.9; c+=vec3(.05,.01,.07)*smoothstep(-600.,-100.,w.z); gl_FragColor=vec4(c,1.); return; gl_FragColor=vec4(c,1.);}`});
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),oceanMat); ocean.rotation.x=-Math.PI/2; ocean.position.y=-0.2; scene.add(ocean);
// ---- tierra / playa / carretera (a lo largo del eje Z, ciudad hacia -X)

const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,1200),new THREE.MeshStandardMaterial({color:0x0c0816,roughness:1})); ground.rotation.x=-Math.PI/2; ground.position.set(-228,0.01,0); scene.add(ground);
const dashM=new THREE.MeshBasicMaterial({color:0xffe9a8}); const dashG=new THREE.PlaneGeometry(.18,2.2);
const dashes=new THREE.InstancedMesh(dashG,dashM,300); const tmp=new THREE.Object3D();
for(let i=0;i<300;i++){tmp.position.set(-24,0.03,300-i*4);tmp.rotation.set(-Math.PI/2,0,0);tmp.updateMatrix();dashes.setMatrixAt(i,tmp.matrix);} scene.add(dashes);
// ---- edificios con ventanas
function winTex(hue){const c=document.createElement('canvas');c.width=64;c.height=128;const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,64,128);
 for(let y=4;y<128;y+=8)for(let x=4;x<64;x+=8){if(rnd()<.42){g.fillStyle=rnd()<.25?hue:'#ffd9a0';g.globalAlpha=.5+rnd()*.5;g.fillRect(x,y,4,5);}}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const texs=[winTex('#ff3d9a'),winTex('#21e6c1'),winTex('#9b7bff')];
const neonCols=[0xff3d9a,0x21e6c1,0xffb347,0x9b7bff];
const city=new THREE.Group(); scene.add(city);
for(let i=0;i<260;i++){
 const x=-34-Math.pow(rnd(),.7)*150, z=260-rnd()*560, w=6+rnd()*10, d=6+rnd()*10, h=8+Math.pow(rnd(),2.2)*95*(x>-80?1:.8);
 const t=texs[i%3].clone(); t.needsUpdate=true; t.repeat.set(Math.max(1,w/6),Math.max(1,h/10));
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:0x120c22,roughness:.7,metalness:.2,emissive:0xffffff,emissiveMap:t,emissiveIntensity:.5}));
 m.position.set(x,h/2,z); city.add(m);
 if(rnd()<.45){ const nc=neonCols[i%4]; const strip=new THREE.Mesh(new THREE.BoxGeometry(w+.2,.35,d+.2),new THREE.MeshBasicMaterial({color:nc})); strip.position.set(x,h+.1,z); city.add(strip);
  if(rnd()<.5){const v=new THREE.Mesh(new THREE.BoxGeometry(.3,h*.8,.3),new THREE.MeshBasicMaterial({color:nc})); v.position.set(x+w/2+.05,h*.45,z+d/2+.05); city.add(v);} }
}
// ---- palmeras (siluetas con luz de borde)
const trunkM=new THREE.MeshStandardMaterial({color:0x1a0f20,roughness:.9}), frondM=new THREE.MeshStandardMaterial({color:0x0f1a14,roughness:.8,side:THREE.DoubleSide,emissive:0x0a3a30,emissiveIntensity:.25});
function palm(x,z,h){const g=new THREE.Group();const lean=(rnd()-.5)*.25;
 for(let s=0;s<8;s++){const seg=new THREE.Mesh(new THREE.CylinderGeometry(.22-s*.012,.26-s*.012,h/8,8),trunkM); seg.position.set(Math.sin(lean)*s*h/8*.6,s*h/8+h/16,0); seg.rotation.z=-lean*.7; g.add(seg);}
 const top=new THREE.Vector3(Math.sin(lean)*h*.6,h,0);
 for(let k=0;k<9;k++){const f=new THREE.Mesh(new THREE.PlaneGeometry(.9,5.2,1,6),frondM); const pa=f.geometry.attributes.position; for(let i=0;i<pa.count;i++){const yy=pa.getY(i)+2.6; pa.setZ(i,-yy*yy*.09); pa.setX(i,pa.getX(i)*(1-yy/5.4));} f.geometry.computeVertexNormals();
  f.position.copy(top); f.rotation.set(-1.15,k/9*Math.PI*2,0,'YXZ'); f.translateY(2.5); g.add(f);}
 g.position.set(x,0,z); return g;}
const palms=new THREE.Group(); scene.add(palms);
for(let z=280;z>-320;z-=11){ palms.add(palm(-29.5+rnd()*.6,z+rnd()*3,9+rnd()*4)); palms.add(palm(-18.5-rnd()*.6,z+5+rnd()*3,8+rnd()*4)); if(rnd()<.4) palms.add(palm(-10+rnd()*6,z+rnd()*6,7+rnd()*3)); }
// farolas
const lampM=new THREE.MeshBasicMaterial({color:0xffc27a});
for(let z=280;z>-320;z-=22){const p=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,6,6),trunkM);p.position.set(-19.6,3,z);scene.add(p);const b=new THREE.Mesh(new THREE.SphereGeometry(.3,10,8),lampM);b.position.set(-20.2,6,z);scene.add(b);}
// ---- coche deportivo
const car=new THREE.Group(); const paint=new THREE.MeshPhysicalMaterial({color:0xff2a7a,metalness:.6,roughness:.18,clearcoat:1,clearcoatRoughness:.05,envMapIntensity:2.5});
const body=new THREE.Mesh(new THREE.BoxGeometry(2.0,.5,4.4),paint); body.position.y=.55; car.add(body);
const cab=new THREE.Mesh(new THREE.BoxGeometry(1.6,.42,1.9),new THREE.MeshStandardMaterial({color:0x0b0b16,metalness:1,roughness:.05})); cab.position.set(0,.98,-.2); cab.scale.set(1,1,1); car.add(cab);
const nose=new THREE.Mesh(new THREE.BoxGeometry(2.0,.3,1.0),paint); nose.position.set(0,.45,2.5); nose.rotation.x=.18; car.add(nose);
const wheelG=new THREE.CylinderGeometry(.36,.36,.3,16); const wheelM=new THREE.MeshStandardMaterial({color:0x111111,roughness:.6});
for(const[x,z]of[[-1,1.4],[1,1.4],[-1,-1.4],[1,-1.4]]){const w=new THREE.Mesh(wheelG,wheelM);w.rotation.z=Math.PI/2;w.position.set(x,.36,z);car.add(w);}
const hl=new THREE.MeshBasicMaterial({color:0xcfe8ff}), tl=new THREE.MeshBasicMaterial({color:0xff1a3a});
for(const s of[-1,1]){const h=new THREE.Mesh(new THREE.BoxGeometry(.5,.08,.05),hl);h.position.set(s*.65,.6,3.02);car.add(h);const t=new THREE.Mesh(new THREE.BoxGeometry(.6,.1,.05),tl);t.position.set(s*.6,.65,-2.22);car.add(t);}
const glow=new THREE.Mesh(new THREE.PlaneGeometry(2.6,5.2),new THREE.MeshBasicMaterial({color:0x21e6c1,transparent:true,opacity:.22})); glow.rotation.x=-Math.PI/2; glow.position.y=.05; car.add(glow);
const under=new THREE.PointLight(0x21e6c1,2.5,6); under.position.y=.3; car.add(under);
const trailM=new THREE.MeshBasicMaterial({color:0xff1a3a,transparent:true,opacity:.7}); const trails=[];
for(const s of[-1,1]){const tr=new THREE.Mesh(new THREE.PlaneGeometry(.12,1),trailM);tr.rotation.x=-Math.PI/2;car.add(tr);trails.push([tr,s]);}
scene.add(car);
// luces
scene.add(new THREE.HemisphereLight(0xff7ab0,0x10061e,.55));
const moon=new THREE.DirectionalLight(0xffa0c8,1.1); moon.position.set(20,30,-200); scene.add(moon);
const cityGlow=new THREE.PointLight(0xff3d9a,3,250); cityGlow.position.set(-60,40,-40); scene.add(cityGlow);
// post
const comp=new EffectComposer(r); comp.addPass(new RenderPass(scene,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.75,.5,.82); comp.addPass(bloom); comp.addPass(new OutputPass());
const $=id=>document.getElementById(id);
const S=[0,2*BAR,4*BAR,6*BAR,7*BAR,8*BAR+0.6].map(x=>x+OFF); // cortes
window.DURATION=S[5]+2.2;
function ov(id,a){$(id).style.opacity=a;}
window.renderAt=function(t){
 oceanMat.uniforms.t.value=t;
 const carZ=200-t*38; car.position.set(-25.3,0,carZ); car.rotation.y=Math.PI;
 trails.forEach(([tr,s])=>{const L=6+Math.sin(t*3)*.5; tr.scale.y=L; tr.position.set(s*.6,.6,-2.2-L/2);});
 let shot=S.findIndex((s,i)=>t>=s&&(i===S.length-1||t<S[i+1])); if(shot<0)shot=0; const lt=t-S[shot];
 if(shot===0){ const k=ease(lt/S[1]); cam.position.set(lerp(70,40,k),lerp(40,9,k),lerp(170,70,k)); cam.lookAt(lerp(-10,-40,k),lerp(14,18,k),-220); cam.fov=44; }
 else if(shot===1){ cam.position.set(-21.5,1.3,carZ-9+lt*0.6); cam.lookAt(-25.3,1,carZ+4); cam.fov=34; }
 else if(shot===2){ const a=-.6+lt*.22; cam.position.set(-70+Math.cos(a)*60,24+lt*3,-20+Math.sin(a)*60); cam.lookAt(-70,30,-20); cam.fov=46; }
 else if(shot===3){ cam.position.set(-20.5,.7,carZ+3-lt*1.5); cam.lookAt(-25.3,.8,carZ-1); cam.fov=32; }
 else { const k=ease(lt/3); cam.position.set(lerp(20,45,k),lerp(6,22,k),lerp(60,120,k)); cam.lookAt(-30,lerp(10,26,k),-220); cam.fov=44; }
 cam.updateProjectionMatrix();

 // textos
 ov('brand',clamp(t/0.6)*.85);
 ov('t1',clamp((t-1.0)/0.6)*clamp((S[1]-t)/0.4)); $('t1').style.letterSpacing=(0.18+0.12*(1-eOut((t-1)/1.6)))+'em';
 ov('t1s',clamp((t-1.6)/0.6)*clamp((S[1]-t)/0.4));
 const tb=t-S[4]; const bigA=clamp(tb/0.08); ov('big',bigA); $('big').style.transform=`scale(${1+0.5*(1-eOut(tb/0.35))})`;
 ov('date',clamp((tb-0.5)/0.3)); ov('plat',clamp((tb-0.9)/0.3)*.9);
 ov('end',clamp((t-S[5])/0.3)); $('end').style.transform=`scale(${0.8+0.2*eOut((t-S[5])/0.35)})`;
 comp.render();
};
window.ready=Promise.resolve(true);
</script></body></html>
